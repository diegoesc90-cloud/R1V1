name: Daily R1 Screener

on:
  schedule:
    - cron: '30 16 * * 1-5'
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python screener_cloud.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_screener_v2.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: screener $(date -u +%F)"
          git push